[project]
name = "approval-gate"
version = "0.1.0"
description = "Budget-aware approval gate for agent harnesses, evaluated on AgentDojo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentdojo==0.1.35",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
]

[project.optional-dependencies]
training = ["numpy>=2.0"]
analysis = [
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approval_gate"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/approval_gate/executor.py" = ["B006", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
